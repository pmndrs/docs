name: Build documentation and deploy to GitHub Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:

# Cancel previous run (see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: pmndrs/docs/.github/workflows/build.yml@main
    with:
      # Whatever is published, rather than a version number this repository would have to keep
      # in step with itself. Our own site is then built by exactly what consumers install —
      # a broken release shows up here before anyone downstream moves to it.
      version: 'latest'
      # Skips the moving major tag (`v4`), which `git describe` would otherwise prefer on a release
      # commit -- as in ci.yml.
      tag_match: 'v*.*.*'
      mdx: 'docs'
      libname: 'Poimandres'
      libname_short: 'pmndrs'
      home_redirect: '/getting-started/introduction'
      icon: '🖨️'
      logo: 'gutenberg.jpg'
      github: 'https://github.com/pmndrs/docs'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
