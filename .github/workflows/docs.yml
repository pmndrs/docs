name: Build documentation and deploy to GitHub Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:

# Cancel previous run (see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a release commit (changesets' "Version Packages"), ci.yml publishes the version package.json
  # names while this workflow runs: until it has, `latest` is still the previous release, which does
  # not know the pages this commit adds for the new one (the Carousel page broke 4.28.0's deploy
  # this way). So wait for npm's `latest` to have caught up with package.json before building.
  # On any other push the two already agree and this passes at once; a publish that never comes
  # fails here, in the open, instead of deploying a site built by the release before.
  published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Wait for npm's `latest` to be this commit's version
        run: |
          version="$(node -p "require('./package.json').version")"
          for _ in $(seq 1 40); do
            latest="$(npm view @pmndrs/docs dist-tags.latest)"
            # `latest` at or past `version`: the oldest of the two, by semver, is `version`.
            if [ "$(printf '%s\n%s\n' "$version" "$latest" | sort -V | head -n 1)" = "$version" ]; then
              echo "@pmndrs/docs@latest is $latest"
              exit 0
            fi
            echo "@pmndrs/docs@latest is $latest, waiting for $version"
            sleep 30
          done
          echo "::error::@pmndrs/docs@$version was not published within 20 minutes"
          exit 1

  build:
    needs: published
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: pmndrs/docs/.github/workflows/build.yml@main
    with:
      # Whatever is published, rather than a version number this repository would have to keep
      # in step with itself. Our own site is then built by exactly what consumers install —
      # a broken release shows up here before anyone downstream moves to it.
      version: 'latest'
      # Skips the moving major tag (`v4`), which `git describe` would otherwise prefer on a release
      # commit -- as in ci.yml.
      tag_match: 'v*.*.*'
      mdx: 'docs'
      libname: 'docs'
      libname_short: 'docs'
      home_redirect: '/getting-started/introduction'
      icon: '🖨️'
      logo: 'gutenberg.jpg'
      github: 'https://github.com/pmndrs/docs'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
