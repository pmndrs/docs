name: Build documentation and deploy to GitHub Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:

# Cancel previous run (see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release merge triggers this workflow and ci.yml at the same time: `@latest` below would
  # still resolve to the previous version while CI is publishing the new one, and npm only
  # exposes a publish a few minutes after it. Wait until `latest` is the version this commit
  # declares, so the site is never left one release behind. Any other push returns at once.
  wait-for-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Wait for npm `latest` to match package.json
        run: |
          expected=$(node -p "require('./package.json').version")
          deadline=$(( $(date +%s) + 20 * 60 ))
          while true; do
            # `--prefer-online` revalidates every poll instead of trusting npm's cached packument;
            # a failed request is just another miss, retried until the deadline
            latest=$(npm view @pmndrs/docs dist-tags.latest --prefer-online) || latest='unreachable'
            if [ "$latest" = "$expected" ]; then
              echo "npm latest is $expected"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::npm latest is still $latest after 20 min, expected $expected"
              exit 1
            fi
            echo "npm latest is $latest, waiting for $expected"
            sleep 15
          done

  build:
    needs: wait-for-npm
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: pmndrs/docs/.github/workflows/build.yml@main
    with:
      # Whatever is published, rather than a version number this repository would have to keep
      # in step with itself. Our own site is then built by exactly what consumers install —
      # a broken release shows up here before anyone downstream moves to it.
      version: 'latest'
      mdx: 'docs'
      libname: 'Poimandres'
      libname_short: 'pmndrs'
      home_redirect: '/getting-started/introduction'
      icon: '🖨️'
      logo: 'gutenberg.jpg'
      github: 'https://github.com/pmndrs/docs'
      theme_primary: '#323e48'
      theme_scheme: 'tonalSpot'
      theme_contrast: '0'
      theme_note: '#1f6feb'
      theme_tip: '#238636'
      theme_important: '#8957e5'
      theme_warning: '#d29922'
      theme_caution: '#da3633'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
