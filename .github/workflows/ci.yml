name: CI
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main-job:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing signs the release with an OIDC token
      id-token: write

    # Update the Production/Preview environment with the Vercel deployed URL
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
      url: ${{ steps.vercel-deploy.outputs.deployment_url }}

    steps:
      #
      # ███████ ███████ ████████ ██    ██ ██████
      # ██      ██         ██    ██    ██ ██   ██
      # ███████ █████      ██    ██    ██ ██████
      #      ██ ██         ██    ██    ██ ██
      # ███████ ███████    ██     ██████  ██
      #

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      #
      #  ██████ ██   ██  █████  ███    ██  ██████  ███████ ███████ ███████ ████████
      # ██      ██   ██ ██   ██ ████   ██ ██       ██      ██      ██         ██
      # ██      ███████ ███████ ██ ██  ██ ██   ███ █████   ███████ █████      ██
      # ██      ██   ██ ██   ██ ██  ██ ██ ██    ██ ██           ██ ██         ██
      #  ██████ ██   ██ ██   ██ ██   ████  ██████  ███████ ███████ ███████    ██
      #

      # npm auth is trusted publishing (OIDC), so there is no `NPM_TOKEN` — the `id-token:
      # write` permission above is what signs the publish. The trusted publisher declared on
      # npmjs.com names *this* workflow file, so renaming or moving it breaks publishing with
      # ENEEDAUTH. Setting an `NPM_TOKEN` secret would break it too: `changesets/action` then
      # writes an `.npmrc` and skips OIDC entirely.
      - name: Create Release Pull Request or Publish
        id: changesets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changesets/action` pushes `vX.Y.Z` and opens the GitHub release itself. The floating
      # major alias is the one thing it does not do, and it is what consumers pinning
      # `build.yml@v4` resolve through — so it is all that is left here.
      #
      # Gated on the release having happened, which is what keeps it off `pull_request` runs.
      # It used to key off a version-diff instead, and on the Release PR that diff is true: the
      # tags landed on the pull request's ephemeral merge commit, which is not on `main`.
      - name: Move the major version tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          MAJOR="v$(node -p "require('./package.json').version.split('.')[0]")"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git tag -fa "$MAJOR" -m "Update major version tag to $MAJOR"
          git push origin "$MAJOR" --force

      #
      # ██    ██ ███████ ██████   ██████ ███████ ██
      # ██    ██ ██      ██   ██ ██      ██      ██
      # ██    ██ █████   ██████  ██      █████   ██
      #  ██  ██  ██      ██   ██ ██      ██      ██
      #   ████   ███████ ██   ██  ██████ ███████ ███████
      #
      # Whatever "published", we deploy to Vercel (preview for PRs, production for main)
      #

      - id: vercel-deploy
        run: |
          npx -y vercel deploy --token=${{ secrets.VERCEL_TOKEN }} \
            --target=${{ github.event_name == 'push' && 'production' || 'preview' }} \
            --build-env MDX=docs \
            --build-env NEXT_PUBLIC_LIBNAME="Poimandres" \
            --build-env NEXT_PUBLIC_LIBNAME_SHORT="pmndrs" \
            --build-env NEXT_PUBLIC_LIBNAME_DOTSUFFIX_LABEL="docs" \
            --build-env NEXT_PUBLIC_LIBNAME_DOTSUFFIX_HREF="https://pmnd.rs" \
            --build-env BASE_PATH= \
            --build-env DIST_DIR= \
            --build-env OUTPUT= \
            --build-env HOME_REDIRECT= \
            --build-env MDX_BASEURL="https://github.com/${{ github.repository }}/raw/${{ github.head_ref || github.ref_name }}/docs" \
            --build-env EDIT_BASEURL="https://github.com/${{ github.repository }}/edit/${{ github.head_ref || github.ref_name }}/docs" \
            --build-env SOURCECODE_BASEURL="https://github.com/${{ github.repository }}/tree/${{ github.head_ref || github.ref_name }}" \
            --build-env NEXT_PUBLIC_URL= \
            --build-env ICON= \
            --build-env LOGO=gutenberg.jpg \
            --build-env GITHUB="https://github.com/${{ github.repository }}" \
            --build-env DISCORD="${{ secrets.DISCORD }}" \
            --build-env THEME_PRIMARY="#323e48" \
            --build-env THEME_SCHEME="tonalSpot" \
            --build-env THEME_CONTRAST="0" \
            --build-env THEME_NOTE="#1f6feb" \
            --build-env THEME_TIP="#238636" \
            --build-env THEME_IMPORTANT="#8957e5" \
            --build-env THEME_WARNING="#d29922" \
            --build-env THEME_CAUTION="#da3633" \
            --build-env CONTRIBUTORS_PAT="${{ secrets.GITHUB_TOKEN }}" \
            > deployment-url.txt

          echo "deployment_url=$(cat deployment-url.txt)" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
