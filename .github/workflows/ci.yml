name: CI
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main-job:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing signs the release with an OIDC token
      id-token: write

    # Update the Production/Preview environment with the Vercel deployed URL
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
      url: ${{ steps.vercel-deploy.outputs.deployment_url }}

    steps:
      #
      # ███████ ███████ ████████ ██    ██ ██████
      # ██      ██         ██    ██    ██ ██   ██
      # ███████ █████      ██    ██    ██ ██████
      #      ██ ██         ██    ██    ██ ██
      # ███████ ███████    ██     ██████  ██
      #

      # The Release PR is pushed and opened by this App, not by `github-actions[bot]`. Since
      # June 2026 GitHub holds every `pull_request` run on a bot-authored PR at
      # `action_required` when the default token is what touched it — one manual "Approve and
      # run" per push to the Release PR, so on every merge to main. An App installation token
      # is a trusted identity, so those runs start on their own.
      #
      # Minted before the checkout rather than beside the step that needs it: `actions/checkout`
      # persists its own token in the remote URL, and that is the credential `changesets/action`
      # pushes the branch with. Pass it here or the push carries `github-actions[bot]` whatever
      # the API calls use.
      #
      # `continue-on-error` so this degrades instead of breaking: wherever the App is not
      # installed, every use below falls back to the default token.
      - name: Mint an App token
        id: app-token
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # The version switcher in the sidebar footer. The CLI reads git itself, but this site is
      # built by Vercel, from sources `vercel deploy` uploads without `.git`: no tags, no remote.
      # So its `NEXT_PUBLIC_VERSION_*` variables are resolved here, from the full checkout above,
      # by the same function the CLI calls, and handed down as build env -- which also keeps
      # `next.config.mjs` from resolving them again on Vercel.
      #
      # Before `changesets/action`, which can leave HEAD on its `changeset-release/main` commit:
      # the label must describe the commit this run is for.
      #
      # `v*.*.*` skips the moving major tag (`v4`), which `git describe` would otherwise prefer
      # on a release commit.
      #
      # The branches offered are the ones with a deployment to switch to: `main` (docs.pmnd.rs)
      # and the head branches of this repo's open pull requests, the only ones aliased below.
      # Fork and Dependabot PRs are left out: their runs get no Actions secrets, hence no
      # deployment. The script then drops those with no deployment behind their URL yet (a PR
      # whose CI has not run since). Should `gh` fail, the list is left unset and the switcher
      # falls back to the remote's heads (bot branches excluded), filtered the same way.
      # https://docs.github.com/en/code-security/dependabot/troubleshooting-dependabot/troubleshooting-dependabot-on-github-actions
      - id: version
        run: |
          if pr_branches=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json headRefName,isCrossRepository \
            --jq '.[] | select((.isCrossRepository | not) and (.headRefName | startswith("dependabot/") | not)) | .headRefName'); then
            export VERSION_BRANCHES_LIST="main $pr_branches"
          else
            echo "::warning::Could not list the open pull requests; offering the remote's branches instead"
          fi
          node scripts/version-env.mts >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_MATCH: 'v*.*.*'
          VERSION_URL_TEMPLATE: 'https://docs-git-{branch}-pmndrs.vercel.app'
          # Not left to default to `NEXT_PUBLIC_URL`, which previews leave empty
          VERSION_PRODUCTION_URL: 'https://docs.pmnd.rs'

      #
      #  ██████ ██   ██  █████  ███    ██  ██████  ███████ ███████ ███████ ████████
      # ██      ██   ██ ██   ██ ████   ██ ██       ██      ██      ██         ██
      # ██      ███████ ███████ ██ ██  ██ ██   ███ █████   ███████ █████      ██
      # ██      ██   ██ ██   ██ ██  ██ ██ ██    ██ ██           ██ ██         ██
      #  ██████ ██   ██ ██   ██ ██   ████  ██████  ███████ ███████ ███████    ██
      #

      # npm auth is trusted publishing (OIDC), so there is no `NPM_TOKEN` — the `id-token:
      # write` permission above is what signs the publish. The trusted publisher declared on
      # npmjs.com names *this* workflow file, so renaming or moving it breaks publishing with
      # ENEEDAUTH. Setting an `NPM_TOKEN` secret would break it too: `changesets/action` then
      # writes an `.npmrc` and skips OIDC entirely.
      - name: Create Release Pull Request or Publish
        id: changesets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # `changesets/action` pushes `vX.Y.Z` and opens the GitHub release itself. The floating
      # major alias is the one thing it does not do, and it is what consumers pinning
      # `build.yml@v4` resolve through — so it is all that is left here.
      #
      # Gated on the release having happened, which is what keeps it off `pull_request` runs.
      # It used to key off a version-diff instead, and on the Release PR that diff is true: the
      # tags landed on the pull request's ephemeral merge commit, which is not on `main`.
      - name: Move the major version tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          MAJOR="v$(node -p "require('./package.json').version.split('.')[0]")"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git tag -fa "$MAJOR" -m "Update major version tag to $MAJOR"
          git push origin "$MAJOR" --force

      #
      # ██    ██ ███████ ██████   ██████ ███████ ██
      # ██    ██ ██      ██   ██ ██      ██      ██
      # ██    ██ █████   ██████  ██      █████   ██
      #  ██  ██  ██      ██   ██ ██      ██      ██
      #   ████   ███████ ██   ██  ██████ ███████ ███████
      #
      # Whatever "published", we deploy to Vercel (preview for PRs, production for main)
      #

      - id: vercel-deploy
        run: |
          npx -y vercel deploy --token=${{ secrets.VERCEL_TOKEN }} \
            --target=${{ github.event_name == 'push' && 'production' || 'preview' }} \
            --build-env MDX=docs \
            --build-env NEXT_PUBLIC_LIBNAME="Poimandres" \
            --build-env NEXT_PUBLIC_LIBNAME_SHORT="pmndrs" \
            --build-env BASE_PATH= \
            --build-env DIST_DIR= \
            --build-env OUTPUT= \
            --build-env HOME_REDIRECT= \
            --build-env MDX_BASEURL="https://github.com/${{ github.repository }}/raw/$GIT_BRANCH/docs" \
            --build-env EDIT_BASEURL="https://github.com/${{ github.repository }}/edit/$GIT_BRANCH/docs" \
            --build-env SOURCECODE_BASEURL="https://github.com/${{ github.repository }}/tree/$GIT_BRANCH" \
            --build-env NEXT_PUBLIC_URL="$NEXT_PUBLIC_URL" \
            --build-env ICON= \
            --build-env LOGO=gutenberg.jpg \
            --build-env GITHUB="https://github.com/${{ github.repository }}" \
            --build-env DISCORD="${{ secrets.DISCORD }}" \
            --build-env THEME_PRIMARY="#323e48" \
            --build-env THEME_SCHEME="tonalSpot" \
            --build-env THEME_CONTRAST="0" \
            --build-env THEME_COLOR_MATCH="false" \
            --build-env THEME_NOTE="#1f6feb" \
            --build-env THEME_TIP="#238636" \
            --build-env THEME_IMPORTANT="#8957e5" \
            --build-env THEME_WARNING="#d29922" \
            --build-env THEME_CAUTION="#da3633" \
            --build-env THEME_STORYBOOK="#ff4785" \
            --build-env THEME_NPM="#cb3837" \
            --build-env THEME_CHROMATIC="#fc521f" \
            --build-env CONTRIBUTORS_PAT="${{ secrets.GITHUB_TOKEN }}" \
            --build-env NEXT_PUBLIC_VERSION_LABEL="$NEXT_PUBLIC_VERSION_LABEL" \
            --build-env NEXT_PUBLIC_VERSION_BRANCH="$NEXT_PUBLIC_VERSION_BRANCH" \
            --build-env NEXT_PUBLIC_VERSION_URL_TEMPLATE="$NEXT_PUBLIC_VERSION_URL_TEMPLATE" \
            --build-env NEXT_PUBLIC_VERSION_PRODUCTION_BRANCH="$NEXT_PUBLIC_VERSION_PRODUCTION_BRANCH" \
            --build-env NEXT_PUBLIC_VERSION_BRANCHES="$NEXT_PUBLIC_VERSION_BRANCHES" \
            --build-env NEXT_PUBLIC_VERSION_PRODUCTION_URL="$NEXT_PUBLIC_VERSION_PRODUCTION_URL" \
            > deployment-url.txt

          echo "deployment_url=$(cat deployment-url.txt)" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Through env rather than inline: they come from branch names, which a PR author picks
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          # Production only: a preview's metadata, OG images and llms.txt must not point to docs.pmnd.rs
          NEXT_PUBLIC_URL: ${{ github.event_name == 'push' && 'https://docs.pmnd.rs' || '' }}
          NEXT_PUBLIC_VERSION_LABEL: ${{ steps.version.outputs.NEXT_PUBLIC_VERSION_LABEL }}
          NEXT_PUBLIC_VERSION_BRANCH: ${{ steps.version.outputs.NEXT_PUBLIC_VERSION_BRANCH }}
          NEXT_PUBLIC_VERSION_URL_TEMPLATE: ${{ steps.version.outputs.NEXT_PUBLIC_VERSION_URL_TEMPLATE }}
          NEXT_PUBLIC_VERSION_PRODUCTION_BRANCH: ${{ steps.version.outputs.NEXT_PUBLIC_VERSION_PRODUCTION_BRANCH }}
          NEXT_PUBLIC_VERSION_BRANCHES: ${{ steps.version.outputs.NEXT_PUBLIC_VERSION_BRANCHES }}
          NEXT_PUBLIC_VERSION_PRODUCTION_URL: ${{ steps.version.outputs.NEXT_PUBLIC_VERSION_PRODUCTION_URL }}

      # Vercel generates branch URLs (`<project>-git-<branch>-<scope>.vercel.app`) only for
      # deployments made by its Git integration, not for these CLI ones. So give each preview the
      # URL `VERSION_URL_TEMPLATE` links its branch to, and re-point it on every push. Production
      # needs none: `main` is docs.pmnd.rs.
      #
      # Not fatal: a branch name too long for a 63-character hostname label cannot get its alias,
      # and that is no reason to fail the pull request.
      - name: Alias the preview to its branch URL
        if: github.event_name != 'push' && steps.version.outputs.slug != ''
        continue-on-error: true
        run: |
          npx -y vercel alias set "${{ steps.vercel-deploy.outputs.deployment_url }}" \
            "docs-git-${{ steps.version.outputs.slug }}-pmndrs.vercel.app" \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=pmndrs
